# PRODUCTION deployment (Dokploy + Traefik on the VPS).
#
# Service names MUST stay `frontend` and `backend` — the Dokploy Domains tab
# binds each domain to a service by name:
#   sapphire.dawrly.space      -> frontend : 3000
#   api-sapphire.dawrly.space  -> backend  : 8000
# Renaming a service here produces:
#   'Domain "..." is attached to service "frontend" which does not exist'
#
# NOTE: no `ports:` anywhere. Traefik reaches the containers over the compose
# network, so publishing host ports is unnecessary and is exactly what caused
#   'Bind for 0.0.0.0:3000 failed: port is already allocated'
# (the Dokploy dashboard itself owns host port 3000).
#
# Local hot-reload development: docker compose -f docker-compose.dev.yml up

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped

    expose:
      - "8000"

    environment:
      # Bare names = pass through whatever Dokploy -> Environment provides.
      #
      # Do NOT write `- VAR=${VAR:-${OTHER:-}}` here. Compose does not reliably
      # expand a nested ${} inside a default, so that form silently resolves to
      # an empty string and OVERRIDES the value Dokploy injected — which is what
      # produced "OMNIROUTE_API_KEY is not set" despite the key being configured.
      #
      # OMNIROUTE_API_KEY is REQUIRED: without it the first-boot ingest aborts
      # and search cannot embed queries. The provider is OmniRoute (an
      # OpenAI-compatible gateway), not OpenRouter.
      - OMNIROUTE_API_KEY
      - OMNIROUTE_BASE_URL
      # Legacy alias, still honoured by config.py if the new name is absent.
      - OPENROUTER_API_KEY
      # Must match the model the index was built with, or /api/search returns a
      # model-mismatch 503. Verified working on this gateway:
      #   gemini/gemini-embedding-001  (3072 dims)
      - EMBEDDING_MODEL
      - EMBEDDING_BATCH_SIZE
      - TOP_K
      - RELEVANCE_FLOOR
      # CORS for browsers calling the backend domain directly.
      - ALLOWED_ORIGIN

    volumes:
      # Named volume, not a bind mount: data/index is gitignored, so the VPS
      # build context has no index. The entrypoint builds it here on first boot
      # and reuses it on every restart.
      - index-data:/app/data/index

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # First boot runs ingest (~35s for NG243) — do not kill it mid-build.
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # MUST be a build arg, not just an environment variable: Next resolves
        # next.config.ts rewrites at build time and bakes the proxy target into
        # the manifest. Passing it only via `environment` leaves the image
        # pointing at the local-dev default and produces
        #   ECONNREFUSED 127.0.0.1:8010
        BACKEND_URL: http://backend:8000
        # Browser calls the backend domain directly, bypassing the Next rewrite.
        # Traefik makes Next reject proxied POSTs with "400 Invalid host header".
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-https://api-sapphire.dawrly.space}
    restart: unless-stopped

    expose:
      - "3000"

    environment:
      - NODE_ENV=production
      # Kept for parity/debugging; the effective proxy target is the build arg.
      - BACKEND_URL=http://backend:8000

    depends_on:
      backend:
        condition: service_started

volumes:
  index-data:
