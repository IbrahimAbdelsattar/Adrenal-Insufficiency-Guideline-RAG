# Golden question set (FR-031, SC-003).
#
# Each question is paired with the NG243 section that actually answers it, so the
# hit rate is a real measure of retrieval quality rather than a vibe check. Sections
# were read from the source guideline, not guessed.
#
# Target: >= 80% of questions retrieve an expected section within top-K.
#
# A question may legitimately be answered by more than one section; any listed
# section counts as a hit.

questions:
  - id: gq_01
    question: What are the symptoms of adrenal insufficiency?
    expected_doc_id: nice_ng243
    expected_sections: ["1.2"]
    expected_recommendation_ids: ["1.2.1"]
    notes: >-
      1.2.1 lists the persistent symptoms and signs (weight loss, salt craving,
      hyperpigmentation) that should prompt suspicion.

  - id: gq_02
    question: When should I suspect an adrenal crisis?
    expected_doc_id: nice_ng243
    expected_sections: ["1.6"]
    notes: Section 1.6 is titled "When to suspect adrenal crisis".

  - id: gq_03
    question: How should an adrenal crisis be managed immediately?
    expected_doc_id: nice_ng243
    expected_sections: ["1.7"]
    expected_recommendation_ids: ["1.7.1"]
    notes: >-
      1.7.1 directs immediate intravenous or intramuscular hydrocortisone.

  - id: gq_04
    question: What dose of hydrocortisone should be given for suspected adrenal crisis?
    expected_doc_id: nice_ng243
    expected_sections: ["1.7"]
    notes: Emergency dosing and fluid resuscitation sit in section 1.7.

  - id: gq_05
    question: Which glucocorticoid is recommended for routine replacement in adults?
    expected_doc_id: nice_ng243
    expected_sections: ["1.3"]
    notes: Section 1.3 covers routine pharmacological management.

  - id: gq_06
    question: How should glucocorticoid doses be adjusted during illness or fever?
    expected_doc_id: nice_ng243
    expected_sections: ["1.4"]
    notes: >-
      Physiological stress (fever, trauma, surgery) is section 1.4; sick-day dosing
      lives here.

  - id: gq_07
    question: Do steroid doses need adjusting for exams or bereavement?
    expected_doc_id: nice_ng243
    expected_sections: ["1.5"]
    notes: >-
      Section 1.5 covers psychological stress specifically, and is distinct from the
      physiological stress guidance in 1.4.

  - id: gq_08
    question: How often should someone with adrenal insufficiency be reviewed?
    expected_doc_id: nice_ng243
    expected_sections: ["1.8"]
    notes: Section 1.8 covers ongoing care, monitoring and review frequency.

  - id: gq_09
    question: How do you withdraw long-term glucocorticoid treatment safely?
    expected_doc_id: nice_ng243
    expected_sections: ["1.9"]
    notes: >-
      Section 1.9 covers managing glucocorticoid withdrawal to prevent adrenal
      insufficiency.

  - id: gq_10
    question: What information and support should be given to someone newly diagnosed?
    expected_doc_id: nice_ng243
    expected_sections: ["1.1"]
    notes: Section 1.1 covers information, support and shared decision making.

  - id: gq_11
    question: When should someone with suspected adrenal insufficiency be referred?
    expected_doc_id: nice_ng243
    expected_sections: ["1.2"]
    notes: Section 1.2 is "Initial identification and referral".

  - id: gq_12
    question: What is an emergency management kit and what does it contain?
    expected_doc_id: nice_ng243
    expected_sections: ["1.7", "1.9"]
    notes: >-
      Defined in the 1.9 glossary and referenced in the 1.7 emergency guidance;
      either is a legitimate answer.
